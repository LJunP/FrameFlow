spring:
  application:
    name: frameflow-select-learning

  # F1-T2 数据源：默认值与本机 infra/local/docker-compose.yml 里的 PostgreSQL 对齐；
  # 生产/服务器环境用环境变量覆盖（见 .env.example），代码不感知环境差异。
  datasource:
    url: ${FRAMEFLOW_DB_URL:jdbc:postgresql://127.0.0.1:54329/frameflow}
    username: ${FRAMEFLOW_DB_USERNAME:frameflow}
    password: ${FRAMEFLOW_DB_PASSWORD:frameflow_local_only}
  flyway:
    enabled: true
    locations: classpath:db/migration

# MyBatis：列名 snake_case → 属性 camelCase 自动映射
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# F1-T1 自定义配置段：AppInfoProperties(prefix = "frameflow.app") 绑定这里。
# 改这里的 name/version，重启后 /api/v1/ping 的返回随之变化——
# 这就是"配置外置"的意义：改配置不用改代码。
frameflow:
  app:
    name: frameflow-select
    version: 0.1.0-SNAPSHOT
  security:
    # ISO-8601 时长：access 15 分钟（盗取窗口），refresh 14 天（免频繁登录）
    access-token-ttl: PT15M
    refresh-token-ttl: P14D

server:
  port: ${FRAMEFLOW_SERVER_PORT:18080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
