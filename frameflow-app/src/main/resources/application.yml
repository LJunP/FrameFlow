server:
  address: ${FRAMEFLOW_SERVER_ADDRESS:127.0.0.1}
  port: ${FRAMEFLOW_SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    com.zaxxer.hikari.pool.PoolBase: ERROR
    org.springframework.jdbc: INFO

spring:
  application:
    name: frameflow
  datasource:
    url: ${FRAMEFLOW_DB_URL:jdbc:postgresql://127.0.0.1:54329/frameflow}
    username: ${FRAMEFLOW_DB_USERNAME:frameflow}
    password: ${FRAMEFLOW_DB_PASSWORD:frameflow_local_only}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
