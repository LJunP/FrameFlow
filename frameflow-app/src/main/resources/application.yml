spring:
  application:
    name: frameflow-select
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  # F1-T2 数据源：默认值与本机 infra/local/docker-compose.yml 里的 PostgreSQL 对齐；
  # 生产/服务器环境用环境变量覆盖（见 .env.example），代码不感知环境差异。
  datasource:
    url: ${FRAMEFLOW_DB_URL:jdbc:postgresql://127.0.0.1:54329/frameflow}
    username: ${FRAMEFLOW_DB_USERNAME:frameflow}
    password: ${FRAMEFLOW_DB_PASSWORD:frameflow_local_only}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${FRAMEFLOW_REDIS_HOST:127.0.0.1}
      port: ${FRAMEFLOW_REDIS_PORT:6379}
      password: ${FRAMEFLOW_REDIS_PASSWORD:}
      # 快速失败：Redis 挂掉时业务走降级分支，不能让请求挂一分钟等超时
      timeout: 500ms
      connect-timeout: 500ms
  rabbitmq:
    host: ${FRAMEFLOW_RABBITMQ_HOST:127.0.0.1}
    port: ${FRAMEFLOW_RABBITMQ_PORT:5672}
    username: ${FRAMEFLOW_RABBITMQ_USER:frameflow}
    password: ${FRAMEFLOW_RABBITMQ_PASSWORD:frameflow_local_only}
    virtual-host: ${FRAMEFLOW_RABBITMQ_VHOST:/}
    # ★ Publisher Confirm：broker 收到才返回（消息不"发出即忘"）
    publisher-confirm-type: correlated

# MyBatis：列名 snake_case → 属性 camelCase 自动映射
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# F1-T1 自定义配置段：AppInfoProperties(prefix = "frameflow.app") 绑定这里。
# 改这里的 name/version，重启后 /api/v1/ping 的返回随之变化——
# 这就是"配置外置"的意义：改配置不用改代码。
frameflow:
  # 环境标识：local / dev / staging / production。
  # SecurityStartupValidator 只在非 local 环境强制密钥 fail-closed，
  # 避免本地与测试环境因缺少真实凭据而无法启动。
  env: ${FRAMEFLOW_ENV:local}
  app:
    name: frameflow-select
    version: 0.1.0-SNAPSHOT
  security:
    # ISO-8601 时长：access 15 分钟（盗取窗口），refresh 14 天（免频繁登录）
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
    # local 可用启动时临时密钥；dev/staging/production 必须设为 false，
    # 并通过 Docker Secret 文件挂载稳定的 PKCS#8 私钥 + X.509 公钥。
    allow-ephemeral-rsa-key: ${FRAMEFLOW_ALLOW_EPHEMERAL_RSA_KEY:true}
    jwt-private-key-pem: '${FRAMEFLOW_JWT_PRIVATE_KEY_PEM:}'
    jwt-public-key-pem: '${FRAMEFLOW_JWT_PUBLIC_KEY_PEM:}'
    jwt-private-key-file: ${FRAMEFLOW_JWT_PRIVATE_KEY_FILE:}
    jwt-public-key-file: ${FRAMEFLOW_JWT_PUBLIC_KEY_FILE:}
  storage:
    # MinIO（infra/local/docker-compose.yml）；生产用环境变量覆盖。
    # endpoint 是 Java/Worker 所在网络的内部地址；public-endpoint 仅用于签发
    # 浏览器直传/播放 URL。Compose 中两者必须分开，否则一端必然无法访问。
    endpoint: ${FRAMEFLOW_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${FRAMEFLOW_STORAGE_PUBLIC_ENDPOINT:}
    region: ${FRAMEFLOW_STORAGE_REGION:us-east-1}
    access-key: ${FRAMEFLOW_STORAGE_ACCESS_KEY:frameflow}
    secret-key: ${FRAMEFLOW_STORAGE_SECRET_KEY:frameflow_local_only}
    bucket: ${FRAMEFLOW_STORAGE_BUCKET:frameflow-media-local}
    presign-ttl: PT30M        # 直传 URL 有效期
    multipart-threshold: 32MB # 超过此大小走分片上传
    part-size: 8MB            # 建议分片大小（客户端参考）
    upload-session-ttl: PT1H  # 上传会话超时：超时未完成的候选在对账时判 INVALID
  worker:
    # 内部回写接口共享密钥（生产必须用环境变量覆盖）
    result-key: ${FRAMEFLOW_WORKER_KEY:frameflow-dev-worker-key}
  admin:
    # 平台运维接口（/api/v1/admin/**）密钥。
    # ★ 故意不设默认值：留空时 AdminAuthFilter 拒绝全部运维请求（fail-closed）。
    # MQ 是全局基础设施，不能用"团队 OWNER"授权——注册即成 OWNER 会让全员可重放
    # 所有团队的死信。这里必须与团队角色彻底解耦。
    api-key: ${FRAMEFLOW_ADMIN_API_KEY:}
  semantic:
    # 平台统一托管的模型目录。JSON 中只写 Key 的环境变量名，绝不写 Key 本身；
    # 空目录保持 F6 单模型配置兼容，模型名继续读取 FRAMEFLOW_SEMANTIC_MODEL。
    model-catalog-json: '${FRAMEFLOW_SEMANTIC_MODEL_CATALOG_JSON:}'
    legacy-model: ${FRAMEFLOW_SEMANTIC_MODEL:gpt-4o-mini}
  mail:
    host: ${FRAMEFLOW_MAIL_HOST:}
    port: ${FRAMEFLOW_MAIL_PORT:1025}
    username: ${FRAMEFLOW_MAIL_USERNAME:}
    password: ${FRAMEFLOW_MAIL_PASSWORD:}
    from: ${FRAMEFLOW_MAIL_FROM:FrameFlow <noreply@localhost>}
    public-base-url: ${FRAMEFLOW_PUBLIC_BASE_URL:http://127.0.0.1:3100}

server:
  # 宿主机直跑时可绑定 127.0.0.1；容器内保持 0.0.0.0，再由 Compose
  # 端口映射/Nginx 控制暴露面。之前 .env 有该变量但源码未绑定，实际无效。
  address: ${FRAMEFLOW_SERVER_ADDRESS:0.0.0.0}
  port: ${FRAMEFLOW_SERVER_PORT:18080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: frameflow-select
      environment: ${FRAMEFLOW_ENV:local}
    distribution:
      # ★ 核心：Prometheus 的 histogram_quantile 依赖真实 bucket；只发布
      # 客户端 percentile 无法跨实例聚合，Grafana P95 与延迟告警会失真。
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s

logging:
  structured:
    # Spring Boot 3.4 原生 Logstash JSON；local 如需人读可显式设为留空/自定义，
    # 容器环境统一保留单行 JSON 供 Loki 检索。
    format:
      console: ${FRAMEFLOW_LOG_FORMAT:logstash}
    json:
      add:
        service: frameflow-app
        environment: ${FRAMEFLOW_ENV:local}
