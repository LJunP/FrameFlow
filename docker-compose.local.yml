name: frameflow-local-p0

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${FRAMEFLOW_POSTGRES_PORT:-54329}:5432"
    environment:
      POSTGRES_DB: ${FRAMEFLOW_POSTGRES_DB:-frameflow}
      POSTGRES_USER: ${FRAMEFLOW_DB_USERNAME:-frameflow}
      POSTGRES_PASSWORD: ${FRAMEFLOW_DB_PASSWORD:-frameflow_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 10s

volumes:
  postgres-data:
