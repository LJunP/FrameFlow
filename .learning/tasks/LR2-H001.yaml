# LR2-H001(HUMAN_CORE,第二个待办任务)
id: LR2-H001
stage: LR2
owner: HUMAN_CORE
goal: 租赁并手工初始化 Non-production Linux VPS,建立安全登录与基础系统检查能力
whyItMatters: 这是你第一次真实接触服务器;后续所有 Dev/Staging/Production 部署都建立在此
prerequisites:
  - LR1 Gate: FOUNDATION_SKILLS_ACCEPTED
  - 已通读 docs/books/BOOK-05
nonGoals: [不安装 Docker(那是 LR3),不部署任何应用]
readSet: [docs/books/BOOK-05]
writeSet: [.learning/evidence 目录(脱敏记录)]
manualSteps:
  - 选择并租赁一台 Non-production VPS(任意主流厂商,最低配即可)
  - 在本地生成 SSH Key(ssh-keygen),并把公钥安装到服务器
  - 首次 SSH 登录,创建非 root 用户,配置 sudo
  - 禁用 root 密码登录,配置 SSH 安全(仅密钥登录)
  - 配置防火墙(仅开放所需端口如 22)
  - 设置时区;检查 CPU、内存、磁盘(ps/top/free/df/du)
  - 练习 ss/curl/grep/tail/journalctl 等命令
  - 提交脱敏 Evidence(命令输出必须抹掉 IP、密钥指纹等)
allowedAgentHelp: 只提供检查清单、命令讲解、结果审查与故障分析;不代替操作,不读取服务器密码与私钥
acceptanceCriteria:
  - 可以 SSH 登录非 root 用户;root 密码登录已禁用;防火墙生效
  - 能答出服务器规格与资源使用情况
  - Evidence 已脱敏提交(.learning/evidence/)
automatedTests: []
manualEvidence:
  - SSH 配置记录(脱敏)
  - 系统信息输出(脱敏)
  - 失败记录与问题定位过程
  - 个人总结
explainBackQuestions:
  - 为什么禁用 root 密码登录而用密钥
  - 用户、sudo、权限的基本模型
  - ps/top/free/df/du/ss 分别看什么
  - 防火墙如何影响端口访问
failureDrill: [故意拒绝一次 SSH 登录并排查原因]
rollback: [从厂商控制台重置密码/重建实例]
status: READY
