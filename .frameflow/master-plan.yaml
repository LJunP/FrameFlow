version: 1.0.0
project: FrameFlow Select
target: LOCAL_MVP_COMPLETE
state_file: .frameflow/state.json
task_directory: .frameflow/tasks
evidence_root: evidence/frameflow-select
rules:
  one_active_stage: true
  one_primary_task: true
  independent_verification: required
  max_attempts_per_strategy: 2
  no_remote_operations: true
  no_future_stage_implementation: true
  task_granularity: vertical_outcome_not_micro_governance
stages:
- id: S0
  name: Controlled Pivot and Baseline
  gate: PIVOT_BASELINE_ACCEPTED_LOCAL
  outcome: Legacy FrameFlow is recoverable and the repository has one authoritative FrameFlow Select direction.
  tasks:
  - id: FF-PIV-001
    title: Preserve the real legacy baseline and resolve dirty evidence
    type: migration
    depends_on: []
    outputs:
    - legacy_snapshot
    - baseline_manifest
    - explained_dirty_state
    acceptance:
    - handoff_payload_is_distinguished_from_preexisting_dirty_work
    - all_preexisting_changes_are_preserved_before_cleanup
    - m01h_evidence_anomaly_is_explained_or_marked_unknown
    - no_source_change_is_silently_discarded
    fallback: preserve_binary_patch_and_continue_from_recorded_head_without_claiming_clean_baseline
  - id: FF-PIV-002
    title: Freeze legacy history and install the new authority system
    type: migration
    depends_on:
    - FF-PIV-001
    outputs:
    - legacy_tag
    - frameflow_select_branch
    - legacy_docs_archive
    - docs_core
    - docs_contracts
    - .frameflow
    acceptance:
    - legacy_tag_or_equivalent_manifest_resolves
    - new_branch_created_without_rewriting_main
    - legacy_docs_archived_before_replacement
    - exactly_six_authoritative_books
    - old_future_tasks_cancelled
    - pack_validation_and_migration_validation_pass
    fallback: retain_legacy_files_in_place_with_machine_readable_non_authoritative_registry_then_install_new_facts
  - id: FF-PIV-003
    title: Harden repository hygiene roles and reproducible toolchain
    type: hardening
    depends_on:
    - FF-PIV-002
    outputs:
    - secret_safe_key_workflow
    - role_forward_migration
    - permission_tests
    - pinned_toolchain
    - clean_packaging_policy
    acceptance:
    - old_flyway_files_unchanged
    - roles_are_OWNER_OPERATOR_REVIEWER_VIEWER_with_compatibility_mapping
    - owner_invariant_and_negative_authorization_tests_pass
    - no_tracked_private_keys_or_build_junk
    - existing_identity_and_contract_tests_pass
    - no_unnecessary_framework_major_upgrade
    fallback: keep_current_compatible_java_spring_versions_and_use_role_alias_compatibility_layer
  - id: FF-PIV-004
    title: Independently verify the complete pivot baseline
    type: gate
    depends_on:
    - FF-PIV-003
    outputs:
    - stage0_verdict
    - pivot_evidence_index
    acceptance:
    - clean_worktree_or_explained_handoff_payload
    - one_active_product_direction
    - legacy_recovery_tested
    - repository_validation_passes
    fallback: repair_only_the_failed_pivot_invariant_without_starting_product_features
- id: S1
  name: Local Feasibility and Evaluation Foundation
  gate: LOCAL_FEASIBILITY_ACCEPTED
  outcome: Synthetic media exercises deterministic QA, duplicate detection, bounded semantic contracts and reproducible evaluation.
  tasks:
  - id: FF-FEA-001
    title: Build the synthetic dataset and deterministic media QA toolkit
    type: experiment
    depends_on:
    - FF-PIV-004
    outputs:
    - dataset_manifest
    - fixture_generator
    - media_probe_cli
    - technical_findings
    - detector_tests
    acceptance:
    - fixtures_cover_normal_wrong_aspect_short_silent_black_freeze_exact_duplicate_and_low_resolution
    - ffprobe_facts_are_machine_readable
    - black_freeze_duration_aspect_resolution_and_audio_checks_are_tested
    - fixtures_are_reproducible_and_copyright_safe
    fallback: use_metadata_only_fixtures_and capability detection when ffmpeg is unavailable
  - id: FF-FEA-002
    title: Build duplicate baseline semantic provider contract and evaluation harness
    type: experiment
    depends_on:
    - FF-FEA-001
    outputs:
    - fingerprints
    - similarity_matrix
    - semantic_provider_spi
    - fake_provider
    - evaluation_cli
    - metrics_report
    acceptance:
    - exact_duplicates_cluster
    - near_duplicate_threshold_and_false_merge_examples_are_reported
    - fake_provider_supports_pass_violate_unknown_error
    - semantic_claims_require_evidence
    - evaluation_records_versions_config_cost_and_failures
    - no_real_world_accuracy_claim
    fallback: ship exact_hash_plus_perceptual_hash and semantic_contract_tests while marking advanced metrics unverified
  - id: FF-FEA-003
    title: Independently verify local feasibility foundation
    type: gate
    depends_on:
    - FF-FEA-002
    outputs:
    - local_feasibility_verdict
    - external_validation_gap
    acceptance:
    - pipeline_reproduces_from_clean_generated_fixtures
    - technical_metrics_and_failure_cases_are_explained
    - paid_provider_is_not_required_for_local_product_development
    fallback: narrow local MVP to deterministic QA plus manual review while retaining semantic interfaces
- id: S2
  name: Contract-first Domain Foundation
  gate: DOMAIN_FOUNDATION_ACCEPTED
  outcome: OpenAPI, forward-only schema and Java domain modules represent the complete FrameFlow Select workflow.
  tasks:
  - id: FF-DOM-001
    title: Finalize OpenAPI domain contracts state machines and permissions
    type: contract
    depends_on:
    - FF-FEA-003
    outputs:
    - openapi_v1
    - error_catalog
    - domain_contracts
    - state_machine_tests
    - message_schema_baseline
    acceptance:
    - identity_contract_is_preserved_or_versioned
    - project_profile_batch_candidate_analysis_review_ranking_selection_apis_are_defined
    - idempotency_tenant_authorization_and_404_policy_are_explicit
    - async_and_error_contracts_are_complete
    - schemas_validate
    fallback: split OpenAPI into referenced files while preserving one authoritative root bundle
  - id: FF-DOM-002
    title: Implement the complete Java modular-monolith domain foundation
    type: feature
    depends_on:
    - FF-DOM-001
    outputs:
    - forward_migrations
    - project_profile_modules
    - batch_candidate_modules
    - analysis_review_modules
    - ranking_selection_modules
    - integration_tests
    acceptance:
    - published_quality_profile_versions_are_immutable
    - batch_references_prompt_and_profile_snapshots
    - candidate_versions_and_analysis_runs_are_immutable
    - machine_results_and_human_overrides_are_separate
    - ranking_and_selection_snapshots_are_versioned
    - tenant_and_permission_negative_tests_pass
    - runtime_openapi_matches_contract
    fallback: store versioned profile payloads as validated JSONB while keeping typed service boundaries
  - id: FF-DOM-003
    title: Independently verify domain and contract foundation
    type: gate
    depends_on:
    - FF-DOM-002
    outputs:
    - domain_verdict
    - migration_contract_evidence
    acceptance:
    - fresh_database_migration_passes
    - upgrade_from_legacy_schema_passes
    - architecture_openapi_idempotency_and_authorization_tests_pass
    fallback: repair contract or domain only without introducing media infrastructure
- id: S3
  name: Storage Async Worker Vertical Slice
  gate: SINGLE_CANDIDATE_SLICE_ACCEPTED
  outcome: One candidate can be uploaded, analyzed asynchronously, recovered and reviewed end to end.
  tasks:
  - id: FF-VSL-001
    title: Implement immutable candidate upload and object-storage boundary
    type: feature
    depends_on:
    - FF-DOM-003
    outputs:
    - storage_port
    - minio_adapter
    - local_adapter
    - upload_session
    - checksum_validation
    acceptance:
    - browser_never_receives_permanent_storage_credentials
    - object_keys_are_tenant_scoped
    - size_type_digest_and_completion_are_validated
    - candidate_source_metadata_is_not_fabricated
    - local_adapter_matches_storage_contract
    fallback: use local filesystem adapter as default while keeping MinIO integration tests optional
  - id: FF-VSL-002
    title: Implement reliable analysis dispatch Python worker and deterministic pipeline
    type: feature
    depends_on:
    - FF-VSL-001
    outputs:
    - outbox
    - rabbitmq_contract
    - db_queue_fallback
    - python_worker
    - deterministic_pipeline
    - idempotent_result_ingest
    acceptance:
    - postgres_is_final_business_state_source
    - worker_never_writes_java_business_tables
    - duplicate_command_and_result_delivery_are_idempotent
    - retry_timeout_cancel_dead_letter_and_analysis_error_are modeled
    - media_facts_findings_and_evidence_artifacts_return
    - worker_contract_tests_pass
    fallback: use database job queue and local worker CLI behind the same ports when RabbitMQ or Docker is unavailable
  - id: FF-VSL-003
    title: Complete and independently verify single-candidate vertical slice
    type: gate
    depends_on:
    - FF-VSL-002
    outputs:
    - single_candidate_api
    - review_flow
    - recovery_tests
    - single_candidate_verdict
    acceptance:
    - upload_start_progress_result_finding_review_and_rerun_work_end_to_end
    - restart_does_not_lose_terminal_or_recoverable_state
    - corrupt_media_ends_as_analysis_error_not_quality_reject
    - clean_fixture_e2e_passes
    fallback: run synchronous local adapter while preserving async resource contracts
- id: S4
  name: Batch Engine and Deterministic Quality Gate
  gate: BATCH_ENGINE_ACCEPTED
  outcome: A bounded batch processes reliably with partial failure progress evidence and deterministic eligibility decisions.
  tasks:
  - id: FF-BAT-001
    title: Implement batch ingestion scheduling progress cancellation and reconciliation
    type: feature
    depends_on:
    - FF-VSL-003
    outputs:
    - multi_upload
    - bounded_scheduler
    - backpressure
    - progress_api
    - reconciler
    - rerun
    acceptance:
    - design_range_20_to_300_candidates_is_enforced_without_unbounded_memory
    - client_retries_are_idempotent
    - partial_upload_and_analysis_failure_are_visible_and_recoverable
    - per_team_and_global_limits_exist
    - no_permanent_processing_state
    - rerun_creates_new_analysis_runs
    fallback: use sequential processing with the same API and explicit capacity limits
  - id: FF-BAT-002
    title: Implement deterministic eligibility gate quality vector and versioned batch summary
    type: feature
    depends_on:
    - FF-BAT-001
    outputs:
    - gate_engine
    - quality_vector
    - rule_versioning
    - batch_summary
    - evidence_index
    acceptance:
    - hard_constraints_are_separate_from_ranking
    - unknown_never_auto_rejects
    - rule_detector_and_profile_versions_are_recorded
    - every automatic reject_has_deterministic_evidence
    - batch_summary_reconciles_partial_failures
    fallback: downgrade non_file_rules to review_only and keep deterministic file gates
  - id: FF-BAT-003
    title: Independently verify batch reliability and quality gate
    type: gate
    depends_on:
    - FF-BAT-002
    outputs:
    - batch_verdict
    - restart_duplicate_cancel_load_evidence
    acceptance:
    - generated_fixture_batch_e2e_passes
    - duplicate_delivery_restart_cancel_timeout_and_partial_failure_tests_pass
    - bounded_resource_behavior_is_demonstrated
    fallback: reduce parallelism rather than removing reliability semantics
- id: S5
  name: Evidence-grounded Semantic QA
  gate: SEMANTIC_QA_ACCEPTED_LOCAL
  outcome: Prompt and Brief assertions operate through a bounded provider abstraction with evidence, unknowns and cost controls.
  tasks:
  - id: FF-AIQ-001
    title: Implement versioned Brief assertions evidence bundles and semantic result ingestion
    type: feature
    depends_on:
    - FF-BAT-003
    outputs:
    - assertion_model
    - evidence_bundle
    - prompt_versions
    - semantic_findings
    - review_only_policy
    acceptance:
    - source_requirements_and_prompt_snapshot_are_preserved
    - provider_input_is_bounded_to_media_evidence_and_business_context
    - output_is_structured_and_schema_validated
    - pass_violate_unknown_error_are_first_class
    - semantic_findings_default_to_review
    - provider_failure_does_not_corrupt_batch
    fallback: support text_metadata_and_selected_keyframe assertions only
  - id: FF-AIQ-002
    title: Implement fake and optional real multimodal adapters evaluation cost and observability
    type: feature
    depends_on:
    - FF-AIQ-001
    outputs:
    - fake_adapter
    - openai_compatible_adapter
    - budget_limits
    - semantic_eval
    - trace_metrics
    acceptance:
    - fake_adapter_drives_full_e2e_without_secret
    - real_adapter_is_optional_and disabled_without key
    - timeouts_retries_rate_and_cost_are bounded
    - provider_model_prompt_and_usage_are recorded
    - no_claim_of_external_accuracy_without real labeled data
    fallback: ship fake adapter as default and mark real_provider_unconfigured
  - id: FF-AIQ-003
    title: Independently verify semantic QA safety and fallbacks
    type: gate
    depends_on:
    - FF-AIQ-002
    outputs:
    - semantic_verdict
    - provider_failure_matrix
    acceptance:
    - all semantic verdict paths are tested
    - no semantic auto_reject
    - prompt_injection_like media text cannot change tool or policy boundaries
    - local product remains usable with provider disabled
    fallback: disable semantic execution by default while retaining review workflow and contracts
- id: S6
  name: Duplicate Clustering Ranking and Top-K
  gate: SELECTION_ENGINE_ACCEPTED
  outcome: The system reduces duplicates and produces an explainable, versioned candidate shortlist with human control.
  tasks:
  - id: FF-SEL-001
    title: Implement exact and near-duplicate similarity graph and stable clusters
    type: feature
    depends_on:
    - FF-AIQ-003
    outputs:
    - fingerprints
    - similarity_edges
    - clusters
    - cluster_explanations
    - threshold_versioning
    acceptance:
    - exact_duplicates_always_cluster
    - near_duplicate_threshold_is_versioned
    - representative_selection_is_deterministic
    - false_merge_and_false_split_cases_are visible
    - clustering_failure_does_not_remove_candidates
    fallback: use exact digest plus perceptual keyframe hash and no advanced embeddings
  - id: FF-SEL-002
    title: Implement explainable ranking Top-K human feedback locking and export
    type: feature
    depends_on:
    - FF-SEL-001
    outputs:
    - ranking_engine
    - ranking_snapshot
    - selection_set
    - human_feedback
    - json_csv_export
    acceptance:
    - only eligible_or_reviewed_candidates_enter ranking
    - score_breakdown_and_weights_are visible
    - unknown_dimensions_follow_declared policy
    - ranking snapshot and locked selection set are immutable
    - human choice can override ranking without rewriting machine result
    - export_contains_evidence_and_versions
    fallback: use deterministic weighted ranking and manual tie_breaking
  - id: FF-SEL-003
    title: Independently verify selection engine
    type: gate
    depends_on:
    - FF-SEL-002
    outputs:
    - selection_verdict
    - ranking_reproducibility_report
    acceptance:
    - same inputs_and_versions_produce_same ranking
    - duplicate cluster and Top_K fixture cases pass
    - human override and lock_version tests pass
    fallback: disable near_duplicate merge and retain exact duplicates plus manual selection
- id: S7
  name: Product Web Experience
  gate: WEB_PRODUCT_ACCEPTED
  outcome: A user can complete the full local FrameFlow Select workflow through a coherent desktop web product.
  tasks:
  - id: FF-WEB-001
    title: Build Next.js BFF authentication project profile batch and upload experience
    type: feature
    depends_on:
    - FF-SEL-003
    outputs:
    - web_workspace
    - bff_auth
    - project_pages
    - profile_builder
    - batch_upload
    acceptance:
    - tokens_are_not_exposed_to_browser_javascript
    - team_context_and_permissions_are enforced
    - quality_profile_rules_are understandable
    - multi_file_upload_has validation progress retry_and errors
    - web_contract_types_are generated_or_checked
    fallback: use server_rendered forms and sequential upload before advanced client state
  - id: FF-WEB-002
    title: Build batch progress candidate matrix video timeline and finding review
    type: feature
    depends_on:
    - FF-WEB-001
    outputs:
    - batch_progress
    - candidate_matrix
    - video_player
    - finding_timeline
    - review_actions
    acceptance:
    - processing_and_partial_failure_are visible
    - filters_cover eligible_review_reject_error
    - timecoded evidence seeks player
    - accept_reject_override_preserve machine result
    - keyboard_and_basic_accessibility_paths work
    fallback: use polling instead of SSE while preserving status semantics
  - id: FF-WEB-003
    title: Build compare select export evaluation views and independently verify web E2E
    type: gate
    depends_on:
    - FF-WEB-002
    outputs:
    - compare_view
    - top_k_selection
    - export_ui
    - evaluation_dashboard
    - playwright_smoke
    - web_verdict
    acceptance:
    - user_can_compare_cluster representatives
    - user_can_lock and export Top_K
    - evaluation view separates synthetic_local from external_unverified
    - responsive_desktop_smoke passes
    - complete synthetic workflow passes through browser
    fallback: provide server_rendered comparison and downloadable report if rich timeline widgets fail
- id: S8
  name: Reliability Security Packaging and Final Local MVP
  gate: LOCAL_MVP_COMPLETE
  outcome: The repository is secure reproducible observable recoverable and deliverable as a complete local MVP.
  tasks:
  - id: FF-HRD-001
    title: Harden security reliability observability backup and performance budgets
    type: hardening
    depends_on:
    - FF-WEB-003
    outputs:
    - security_tests
    - structured_logs
    - correlation
    - metrics
    - backup_restore
    - load_report
    - failure_runbooks
    acceptance:
    - authorization_upload_media_and_message boundaries_have negative tests
    - logs_do_not_leak secrets
    - health_and_readiness_cover dependencies
    - backup_restore_or deterministic rebuild_is tested
    - batch capacity budget_is measured
    - known failure_modes have operator actions
    fallback: document measured local limits and use deterministic rebuild instead of complex backup tooling
  - id: FF-HRD-002
    title: Create one-command local environment complete runbook and clean source distribution
    type: delivery
    depends_on:
    - FF-HRD-001
    outputs:
    - docker_compose
    - start_test_demo_scripts
    - RUNBOOK.md
    - FINAL-HANDOVER.md
    - clean_source_zip
    acceptance:
    - one documented command starts required local services_or explicit fallback profile
    - one command runs all tests
    - one command generates_and_runs synthetic demo
    - source archive excludes git secrets_build_outputs_real_media_and_system_junk
    - archive_reextract_validation passes
    fallback: provide profile_specific start commands with a top_level orchestrator script
  - id: FF-HRD-003
    title: Run final independent clean-environment verification and close local MVP
    type: gate
    depends_on:
    - FF-HRD-002
    outputs:
    - final_verdict
    - test_summary
    - known_limitations
    - final_state
    acceptance:
    - all_completion_criteria_have evidence_or explicit not_required classification
    - java_python_web_and_e2e tests pass
    - final_repository_validator passes
    - independent_verifier_passes
    - state_is_LOCAL_MVP_COMPLETE
    - external_validation_is_EXTERNAL_VALIDATION_PENDING
    - no_remote_operation_or_secret_exposure_occurred
    fallback: deliver HARD_BLOCKED_WITH_MAXIMUM_LOCAL_DELIVERY only for execution_contract hard blockers
