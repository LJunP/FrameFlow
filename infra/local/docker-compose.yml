# 本地开发数据库：与本仓 .env.example / application.yml 默认值对齐。
# 用法：docker compose -f infra/local/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: frameflow-local-pg
    ports:
      - "54329:5432"   # 故意用非默认端口，避免与本机已有 PostgreSQL 冲突
    environment:
      POSTGRES_DB: frameflow
      POSTGRES_USER: frameflow
      POSTGRES_PASSWORD: frameflow_local_only   # 仅本机开发值，与 .env.example 一致
    volumes:
      - frameflow-local-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameflow -d frameflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # F3 对象存储：S3 兼容 API（9000），控制台（9001）
  minio:
    image: minio/minio:latest
    container_name: frameflow-local-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台（浏览器打开 http://localhost:9001）
    environment:
      MINIO_ROOT_USER: frameflow
      MINIO_ROOT_PASSWORD: frameflow_local_only   # 仅本机开发值
    command: server /data --console-address ":9001"
    volumes:
      - frameflow-local-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # F4 消息队列：AMQP（5672），管理台（15672，guest/guest 仅本机）
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: frameflow-local-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理台 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: frameflow
      RABBITMQ_DEFAULT_PASS: frameflow_local_only
    volumes:
      - frameflow-local-rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frameflow-local-pg-data:
  frameflow-local-minio-data:
  frameflow-local-rabbit-data:
