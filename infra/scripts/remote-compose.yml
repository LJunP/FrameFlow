name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

# ★ 核心：dev/staging/production 复用同一编排拓扑，但由 Compose project、独立卷、
# 独立凭据、VHost、Bucket 和 loopback 端口隔离。若写 container_name 或共享外部卷，
# 同宿主机上的环境会互相覆盖，最坏会把测试写入生产数据。
services:
  postgres:
    image: postgres:16.9-alpine3.22
    environment:
      POSTGRES_DB: ${FRAMEFLOW_POSTGRES_DB:?required}
      POSTGRES_USER: ${FRAMEFLOW_DB_USERNAME:?required}
      POSTGRES_PASSWORD: ${FRAMEFLOW_DB_PASSWORD:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${FRAMEFLOW_REDIS_PASSWORD:?required}"]
    environment:
      FRAMEFLOW_REDIS_PASSWORD: ${FRAMEFLOW_REDIS_PASSWORD:?required}
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${FRAMEFLOW_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  rabbitmq:
    # Net-new deployments use a supported, digest-pinned broker. Never attach a
    # 3.13 data volume directly: RabbitMQ requires an intermediate 4.2 upgrade.
    image: rabbitmq:4.3.5-management-alpine@sha256:a1a5dd841347af3e32355fd58ac530e831fd394c49e299f862e2fd4ab331cd79
    environment:
      RABBITMQ_DEFAULT_USER: ${FRAMEFLOW_RABBITMQ_USER:?required}
      RABBITMQ_DEFAULT_PASS: ${FRAMEFLOW_RABBITMQ_PASSWORD:?required}
      RABBITMQ_DEFAULT_VHOST: ${FRAMEFLOW_RABBITMQ_VHOST:?required}
    expose: ["15692"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FRAMEFLOW_STORAGE_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${FRAMEFLOW_STORAGE_SECRET_KEY:?required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRAMEFLOW_STORAGE_CORS_ORIGINS:?required}
    ports:
      - "127.0.0.1:${FRAMEFLOW_MINIO_BIND_PORT:?required}:9000"
    volumes: [minio-data:/data]
    # ★ 核心：data 仍是 internal；单独加入非 internal 的 media bridge，Docker 才能
    # 把 loopback published port 转发到 MinIO。若只挂 data，宿主 Nginx 无法代理媒体域名。
    networks: [data, media]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set frameflow http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing "frameflow/$${FRAMEFLOW_STORAGE_BUCKET}";
        mc anonymous set none "frameflow/$${FRAMEFLOW_STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${FRAMEFLOW_STORAGE_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${FRAMEFLOW_STORAGE_SECRET_KEY:?required}
      FRAMEFLOW_STORAGE_BUCKET: ${FRAMEFLOW_STORAGE_BUCKET:?required}
    depends_on:
      minio: {condition: service_healthy}
    networks: [data]
    logging: *logging
    restart: "no"

  app:
    image: ${FRAMEFLOW_APP_IMAGE:?digest-pinned FRAMEFLOW_APP_IMAGE is required}
    environment:
      FRAMEFLOW_ENV: ${FRAMEFLOW_ENV:?required}
      FRAMEFLOW_DB_URL: jdbc:postgresql://postgres:5432/${FRAMEFLOW_POSTGRES_DB:?required}
      FRAMEFLOW_DB_USERNAME: ${FRAMEFLOW_DB_USERNAME:?required}
      FRAMEFLOW_DB_PASSWORD: ${FRAMEFLOW_DB_PASSWORD:?required}
      FRAMEFLOW_REDIS_HOST: redis
      FRAMEFLOW_REDIS_PORT: 6379
      FRAMEFLOW_REDIS_PASSWORD: ${FRAMEFLOW_REDIS_PASSWORD:?required}
      FRAMEFLOW_RABBITMQ_HOST: rabbitmq
      FRAMEFLOW_RABBITMQ_PORT: 5672
      FRAMEFLOW_RABBITMQ_USER: ${FRAMEFLOW_RABBITMQ_USER:?required}
      FRAMEFLOW_RABBITMQ_PASSWORD: ${FRAMEFLOW_RABBITMQ_PASSWORD:?required}
      FRAMEFLOW_RABBITMQ_VHOST: ${FRAMEFLOW_RABBITMQ_VHOST:?required}
      FRAMEFLOW_STORAGE_ENDPOINT: http://minio:9000
      FRAMEFLOW_STORAGE_PUBLIC_ENDPOINT: ${FRAMEFLOW_STORAGE_PUBLIC_ENDPOINT:?required}
      FRAMEFLOW_STORAGE_REGION: ${FRAMEFLOW_STORAGE_REGION:-us-east-1}
      FRAMEFLOW_STORAGE_ACCESS_KEY: ${FRAMEFLOW_STORAGE_ACCESS_KEY:?required}
      FRAMEFLOW_STORAGE_SECRET_KEY: ${FRAMEFLOW_STORAGE_SECRET_KEY:?required}
      FRAMEFLOW_STORAGE_BUCKET: ${FRAMEFLOW_STORAGE_BUCKET:?required}
      FRAMEFLOW_WORKER_KEY: ${FRAMEFLOW_WORKER_KEY:?required}
      FRAMEFLOW_ALLOW_EPHEMERAL_RSA_KEY: "false"
      FRAMEFLOW_JWT_PRIVATE_KEY_FILE: /run/secrets/frameflow_jwt_private_key
      FRAMEFLOW_JWT_PUBLIC_KEY_FILE: /run/secrets/frameflow_jwt_public_key
      FRAMEFLOW_SEMANTIC_MODEL_CATALOG_JSON: ${FRAMEFLOW_SEMANTIC_MODEL_CATALOG_JSON:-}
    secrets:
      - frameflow_jwt_private_key
      - frameflow_jwt_public_key
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [backend, data]
    # 与 Dockerfile 及 generate-jwt-keypair.sh 的 numeric owner 保持一致；Compose
    # file secrets 不会替 file source 改 UID，漂移会让 App 无法读取私钥。
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${FRAMEFLOW_APP_MEMORY_LIMIT:-1536m}
    cpus: ${FRAMEFLOW_APP_CPUS:-1.5}
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:${FRAMEFLOW_ALLOY_SYSLOG_PORT:?required}"
        syslog-format: rfc5424micro
        tag: frameflow-app
        mode: non-blocking
        max-buffer-size: 4m
        cache-disabled: "false"
        cache-max-size: 20m
        cache-max-file: "5"
    restart: unless-stopped

  worker:
    image: ${FRAMEFLOW_WORKER_IMAGE:?digest-pinned FRAMEFLOW_WORKER_IMAGE is required}
    environment:
      FRAMEFLOW_ENV: ${FRAMEFLOW_ENV:?required}
      FRAMEFLOW_RABBITMQ_HOST: rabbitmq
      FRAMEFLOW_RABBITMQ_PORT: 5672
      FRAMEFLOW_RABBITMQ_USER: ${FRAMEFLOW_RABBITMQ_USER:?required}
      FRAMEFLOW_RABBITMQ_PASSWORD: ${FRAMEFLOW_RABBITMQ_PASSWORD:?required}
      FRAMEFLOW_RABBITMQ_VHOST: ${FRAMEFLOW_RABBITMQ_VHOST:?required}
      FRAMEFLOW_STORAGE_ENDPOINT: http://minio:9000
      FRAMEFLOW_STORAGE_ACCESS_KEY: ${FRAMEFLOW_STORAGE_ACCESS_KEY:?required}
      FRAMEFLOW_STORAGE_SECRET_KEY: ${FRAMEFLOW_STORAGE_SECRET_KEY:?required}
      FRAMEFLOW_STORAGE_BUCKET: ${FRAMEFLOW_STORAGE_BUCKET:?required}
      FRAMEFLOW_API_BASE: http://app:18080
      FRAMEFLOW_WORKER_KEY: ${FRAMEFLOW_WORKER_KEY:?required}
      FRAMEFLOW_WORKER_PREFETCH: ${FRAMEFLOW_WORKER_PREFETCH:-2}
      FRAMEFLOW_WORKER_MAX_ATTEMPT: ${FRAMEFLOW_WORKER_MAX_ATTEMPT:-3}
      FRAMEFLOW_METRICS_HOST: 0.0.0.0
      FRAMEFLOW_METRICS_PORT: 9108
      FRAMEFLOW_SEMANTIC_MODEL_CATALOG_JSON: ${FRAMEFLOW_SEMANTIC_MODEL_CATALOG_JSON:-}
    expose: ["9108"]
    depends_on:
      app: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    networks: [backend, data]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=${FRAMEFLOW_WORKER_TMPFS_SIZE:-2g},mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${FRAMEFLOW_WORKER_MEMORY_LIMIT:-3g}
    cpus: ${FRAMEFLOW_WORKER_CPUS:-2.0}
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:${FRAMEFLOW_ALLOY_SYSLOG_PORT:?required}"
        syslog-format: rfc5424micro
        tag: frameflow-worker
        mode: non-blocking
        max-buffer-size: 4m
        cache-disabled: "false"
        cache-max-size: 20m
        cache-max-file: "5"
    restart: unless-stopped

  web:
    image: ${FRAMEFLOW_WEB_IMAGE:?digest-pinned FRAMEFLOW_WEB_IMAGE is required}
    environment:
      FRAMEFLOW_ENV: ${FRAMEFLOW_ENV:?required}
      API_BASE: http://app:18080
      FRAMEFLOW_COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:${FRAMEFLOW_WEB_BIND_PORT:?required}:3000"
    depends_on:
      app: {condition: service_healthy}
    networks: [backend]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${FRAMEFLOW_WEB_MEMORY_LIMIT:-768m}
    cpus: ${FRAMEFLOW_WEB_CPUS:-1.0}
    logging: *logging
    restart: unless-stopped

networks:
  backend:
  data: {internal: true}
  # 只给 MinIO 提供宿主 loopback 端口转发；数据库、Redis、RabbitMQ 仍只在 data。
  media:

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

secrets:
  frameflow_jwt_private_key:
    file: ${FRAMEFLOW_JWT_PRIVATE_KEY_HOST_FILE:?required}
  frameflow_jwt_public_key:
    file: ${FRAMEFLOW_JWT_PUBLIC_KEY_HOST_FILE:?required}
