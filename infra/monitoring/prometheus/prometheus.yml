global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: frameflow-select

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: frameflow-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:18080"]
  - job_name: frameflow-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9108"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
  # RabbitMQ's detailed endpoint requires explicit metric families. Keeping it
  # separate prevents high-cardinality per-queue metrics from entering /metrics.
  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count
    static_configs:
      - targets: ["rabbitmq:15692"]
