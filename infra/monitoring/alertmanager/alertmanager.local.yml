global:
  resolve_timeout: 2m

route:
  receiver: local-audit-sink
  group_by: [alertname, service, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: local-audit-sink
    webhook_configs:
      - url: http://alert-sink:5001/alerts
        send_resolved: true
