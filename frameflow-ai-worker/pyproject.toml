[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameflow-ai-worker"
version = "0.1.0"
description = "FrameFlow Select AI worker (learning skeleton: no business detectors yet)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/frameflow_ai"]
