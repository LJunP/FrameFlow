[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameflow-ai-worker"
version = "0.1.0"
description = "FrameFlow Select media analysis and semantic review worker"
requires-python = ">=3.11"
dependencies = [
    "minio>=7.2,<8",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<6",
    "pika>=1.3,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.scripts]
frameflow-worker = "frameflow_ai.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/frameflow_ai"]
