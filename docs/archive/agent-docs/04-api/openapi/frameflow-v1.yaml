components:
  schemas:
    CreateTeamRequest:
      type: object
      properties:
        name:
          type: string
          description: 团队名称
          maxLength: 100
          minLength: 1
      required:
      - name
    Team:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - name
    Error:
      type: object
      properties:
        code:
          type: string
          description: 稳定错误码
          example: AUTH_REQUIRED
        message:
          type: string
          description: 人类可读的错误说明
        requestId:
          type: string
          format: uuid
          description: 必须与响应 X-Request-Id header 完全相同
        traceId:
          type: string
          description: 可观测环境可选
      required:
      - code
      - message
      - requestId
    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 已注册目标用户邮箱；M01 直接创建或恢复 ACTIVE 成员关系，不发送邀请
        role:
          type: string
          description: 初始团队角色
          enum:
          - OWNER
          - OPERATOR
          - REVIEWER
          - VIEWER
      required:
      - email
      - role
    TeamMember:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teamId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          description: 团队角色（CLIENT 是项目级角色，M02 起，不在团队角色枚举内）
          enum:
          - OWNER
          - OPERATOR
          - REVIEWER
          - VIEWER
        status:
          type: string
          enum:
          - ACTIVE
      required:
      - email
      - id
      - role
      - status
      - teamId
      - userId
    SelectionSet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        batchId:
          type: integer
          format: int64
        lockedBy:
          type: integer
          format: int64
        createdBy:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
        theme:
          type: string
        topK:
          type: integer
          format: int32
        lockedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QualityProfileVersion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        profileId:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        status:
          type: string
        payload:
          type: string
        payloadDigest:
          type: string
        publishedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    CreateProfileRequest:
      type: object
      properties:
        name:
          type: string
        templateType:
          type: string
    CreateProfileVersionRequest:
      type: object
      properties:
        payload:
          type: string
    CreateBatchRequest:
      type: object
      properties:
        name:
          type: string
        promptText:
          type: string
        profileVersionId:
          type: integer
          format: int64
        briefId:
          type: integer
          format: int64
    FindingDto:
      type: object
      properties:
        ruleId:
          type: string
        ruleVersion:
          type: integer
          format: int32
        detectorId:
          type: string
        detectorVersion:
          type: string
        dimension:
          type: string
        findingType:
          type: string
        verdict:
          type: string
        severity:
          type: string
        confidence:
          type: number
          format: double
        automationAction:
          type: string
        startMs:
          type: integer
          format: int32
        endMs:
          type: integer
          format: int32
        summary:
          type: string
        evidence:
          type: string
        origin:
          type: string
    IngestResultRequest:
      type: object
      properties:
        commandId:
          type: string
        status:
          type: string
        decision:
          type: string
        qualityVector:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/FindingDto'
    CompleteUploadRequest:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        sizeBytes:
          type: integer
          format: int64
        contentDigest:
          type: string
    Candidate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teamId:
          type: integer
          format: int64
        batchId:
          type: integer
          format: int64
        parentCandidateId:
          type: integer
          format: int64
        createdBy:
          type: integer
          format: int64
        candidateKey:
          type: string
        status:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClusterRequest:
      type: object
      properties:
        threshold:
          type: number
          format: double
    SimilarityCluster:
      type: object
      properties:
        id:
          type: integer
          format: int64
        batchId:
          type: integer
          format: int64
        representativeCandidateId:
          type: integer
          format: int64
        clusterKey:
          type: string
        algorithmVersion:
          type: string
        threshold:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
    CreateSelectionRequest:
      type: object
      properties:
        name:
          type: string
        topK:
          type: integer
          format: int32
    RankingSnapshot:
      type: object
      properties:
        id:
          type: integer
          format: int64
        batchId:
          type: integer
          format: int64
        createdBy:
          type: integer
          format: int64
        snapshotVersion:
          type: integer
          format: int32
        algorithmVersion:
          type: string
        weights:
          type: string
        featureSchemaVersion:
          type: string
        lockedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AddCandidatesRequest:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
        mediaTypes:
          type: array
          items:
            type: string
    StartAnalysisRequest:
      type: object
      properties:
        candidateId:
          type: integer
          format: int64
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 邮箱（小写规范化）
          maxLength: 255
          minLength: 0
        password:
          type: string
          format: password
          description: 密码（BCrypt 存储，永不出现在响应）
          maxLength: 72
          minLength: 8
        displayName:
          type: string
          description: 显示名称
          maxLength: 100
          minLength: 1
      required:
      - displayName
      - email
      - password
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - PENDING
        lastLoginAt:
          type: string
          format: date-time
      required:
      - displayName
      - email
      - id
      - status
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: 32 字节安全随机值的 Base64URL 无 padding 编码
          maxLength: 43
          minLength: 43
      required:
      - refreshToken
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: RS256 JWT，TTL 15 分钟
        refreshToken:
          type: string
          description: 32 字节安全随机的不透明 Base64URL 字符串；轮换且 TTL 30 天
          maxLength: 43
          minLength: 43
        expiresIn:
          type: integer
          format: int64
          description: Access Token 有效期（秒）
          example: 900
        tokenType:
          type: string
          enum:
          - Bearer
      required:
      - accessToken
      - expiresIn
      - refreshToken
      - tokenType
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 邮箱（登录前先去除首尾空白并转小写）
        password:
          type: string
          format: password
          description: 密码
      required:
      - email
      - password
    UpdateMemberRoleRequest:
      type: object
      properties:
        role:
          type: string
          description: 新团队角色
          enum:
          - OWNER
          - OPERATOR
          - REVIEWER
          - VIEWER
      required:
      - role
    ProbeResponse:
      type: object
      properties:
        status:
          type: string
    TeamList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMembershipSummary'
      required:
      - items
    TeamMembershipSummary:
      type: object
      properties:
        teamId:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
          description: 团队角色（CLIENT 是项目级角色，M02 起，不在团队角色枚举内）
          enum:
          - OWNER
          - OPERATOR
          - REVIEWER
          - VIEWER
        status:
          type: string
          enum:
          - ACTIVE
        createdAt:
          type: string
          format: date-time
          description: 团队创建时间
      required:
      - createdAt
      - name
      - role
      - status
      - teamId
    MemberList:
      type: object
      properties:
