openapi: 3.0.3
info:
  title: FrameFlow Select API
  version: 1.0.0
  description: FrameFlow Select 批量质检与 Top-K 优选平台。身份端点沿用 M01（/api/v1/auth、/api/v1/teams）；产品端点（Project / Quality Profile / Batch / Candidate / Analysis / Ranking / Selection）为运行时 springdoc 权威契约。批次引擎提供 capacity-bounded
    候选摄入、进度、处理（worker 可选、部分失败可恢复）与重跑。
tags:
- name: teams
  description: 团队与成员管理（OWNER 管理操作）
- name: product
  description: Analysis Run 与 Finding
- name: product
  description: 批次引擎：进度、处理、重跑
- name: product
  description: Project 与 Quality Profile
- name: product
  description: Batch 与 Candidate
- name: product
  description: 聚类、排名与选择集
- name: auth
  description: 注册、登录、Token 生命周期
paths:
  /api/v1/teams:
    get:
      tags:
      - teams
      summary: 发现当前用户加入的有效团队
      description: 仅返回当前登录用户 status=ACTIVE 的团队成员关系，用于登录后的团队选择；不会返回其他用户或已移除的成员关系。
      operationId: listMyTeams
      responses:
        '200':
          description: 当前用户的团队成员关系列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
        '401':
          description: 未认证或 Token 无效/过期
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - teams
      summary: 创建团队（创建者自动成为 OWNER；需要 Idempotency-Key）
      description: 任一 ACTIVE 已认证用户均可创建；团队与创建者 OWNER 关系在同一事务写入。
      operationId: createTeam
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          maxLength: 128
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
        required: true
      responses:
        '201':
          description: 团队创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: 参数校验失败或缺少 Idempotency-Key
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证或 Token 无效/过期
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/teams/{teamId}/members:
    get:
      tags:
      - teams
      summary: 团队 ACTIVE 成员列表（仅团队成员）
      operationId: listTeamMembers
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 成员列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          description: 未认证或 Token 无效/过期
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 团队不存在或无权访问
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - teams
      summary: 直接添加已注册成员为 ACTIVE（仅 OWNER；需要 Idempotency-Key）
      description: 已是 ACTIVE 成员返回 409 TEAM_MEMBER_ALREADY_EXISTS；REMOVED 关系则复用原记录并恢复为 ACTIVE。M01 不创建 INVITED 记录。
      operationId: addTeamMember
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          maxLength: 128
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
        required: true
      responses:
        '201':
          description: 成员已添加
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          description: 参数校验失败或缺少 Idempotency-Key
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证或 Token 无效/过期
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 已认证但角色不足（非 OWNER）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 团队或目标用户不存在/无权访问
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: TEAM_MEMBER_ALREADY_EXISTS / 幂等冲突
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/selection-sets/{selectionSetId}/lock:
    post:
      tags:
      - product
      summary: 锁定选择集（不可变）
      operationId: lockSelectionSet
      parameters:
      - name: selectionSetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Team-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SelectionSet'
      security:
      - bearerAuth: []
  /api/v1/quality-profile-versions/{versionId}/publish:
    post:
      tags:
      - product
      summary: 发布模板版本（不可变，仅 OWNER）
      operationId: publishProfileVersion
      parameters:
      - name: versionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QualityProfileVersion'
      security:
      - bearerAuth: []
  /api/v1/projects:
    get:
      tags:
      - product
      summary: 团队项目列表
      operationId: listProjects
      parameters:
      - name: X-Team-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 创建项目（OWNER/OPERATOR）
      operationId: createProject
      parameters:
      - name: X-Team-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
      security:
      - bearerAuth: []
  /api/v1/projects/{projectId}/quality-profiles:
    get:
      tags:
      - product
      summary: 项目质量模板列表
      operationId: listQualityProfiles
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QualityProfile'
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 创建质量模板草稿（OWNER/OPERATOR）
      operationId: createQualityProfile
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
      security:
      - bearerAuth: []
  /api/v1/projects/{projectId}/quality-profiles/{profileId}/versions:
    post:
      tags:
      - product
      summary: 保存质量模板版本草稿
      operationId: createProfileVersion
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: profileId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileVersionRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QualityProfileVersion'
      security:
      - bearerAuth: []
  /api/v1/projects/{projectId}/batches:
    get:
      tags:
      - product
      summary: 项目批次列表
      operationId: listBatches
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 创建批次（OWNER/OPERATOR）
      operationId: createBatch
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
      security:
      - bearerAuth: []
  /api/v1/internal/analysis-runs/{runId}/results:
    post:
      tags:
      - product
      summary: Worker 结果摄取（幂等）
      operationId: ingestAnalysisResult
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestResultRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
      security:
      - bearerAuth: []
  /api/v1/candidates/{candidateId}/upload-session:
    post:
      tags:
      - product
      summary: 创建上传会话
      operationId: createUploadSession
      parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
      security:
      - bearerAuth: []
  /api/v1/candidates/{candidateId}/upload-complete:
    post:
      tags:
      - product
      summary: 确认上传完成（校验大小/摘要）
      operationId: completeUpload
      parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Candidate'
      security:
      - bearerAuth: []
  /api/v1/candidates/{candidateId}/rerun:
    post:
      tags:
      - product
      summary: 重跑候选分析（创建新 Analysis Run）
      operationId: rerunCandidate
      parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Team-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
      security:
      - bearerAuth: []
  /api/v1/batches/{batchId}/similarity-clusters:
    get:
      tags:
      - product
      summary: 批次聚类列表
      operationId: listSimilarityClusters
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarityCluster'
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 计算候选相似度聚类
      operationId: createSimilarityClusters
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarityCluster'
      security:
      - bearerAuth: []
  /api/v1/batches/{batchId}/selection-sets:
    get:
      tags:
      - product
      summary: 批次选择集列表
      operationId: listSelectionSets
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SelectionSet'
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 创建选择集（Top-K）
      operationId: createSelectionSet
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSelectionRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SelectionSet'
      security:
      - bearerAuth: []
  /api/v1/batches/{batchId}/ranking-snapshots:
    get:
      tags:
      - product
      summary: 批次排名快照列表
      operationId: listRankingSnapshots
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 生成排名快照
      operationId: createRankingSnapshot
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RankingSnapshot'
      security:
      - bearerAuth: []
  /api/v1/batches/{batchId}/progress:
    post:
      tags:
      - product
      summary: 批次处理进度（候选状态计数）
      operationId: batchProgress
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Team-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
      security:
      - bearerAuth: []
  /api/v1/batches/{batchId}/process:
    post:
      tags:
      - product
      summary: 处理批次全部候选（OWNER/OPERATOR）
      operationId: processBatch
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Team-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
      security:
      - bearerAuth: []
  /api/v1/batches/{batchId}/candidates:
    get:
      tags:
      - product
      summary: 批次候选列表
      operationId: listCandidates
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 批量添加候选（OWNER/OPERATOR）
      operationId: addCandidates
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCandidatesRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: integer
                  format: int64
      security:
      - bearerAuth: []
  /api/v1/batches/{batchId}/analysis-runs:
    get:
      tags:
      - product
      summary: 批次分析运行列表
      operationId: listAnalysisRuns
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisRun'
      security:
      - bearerAuth: []
    post:
      tags:
      - product
      summary: 启动分析（OWNER/OPERATOR；返回 202 + run id）
      operationId: startAnalysis
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
      security:
      - bearerAuth: []
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: 用户注册
      description: 规范化邮箱已注册时返回 409 USER_EMAIL_CONFLICT。
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: 注册成功，返回用户信息
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 参数校验失败
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 邮箱已被注册
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: 刷新 Token（轮换，旧 Refresh Token 立即失效）
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: 新 Token 对
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh Token 无效/过期/重放
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 登出，撤销 Refresh Token
      description: Refresh Token 是唯一凭据，不要求 Access Token；即使 Access Token 已过期，仍可撤销该设备 token family。
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: 登出成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          description: Refresh Token 无效/过期/重放
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 登录，返回 Token 对
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 登录成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: 参数校验失败
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 邮箱或密码错误
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
