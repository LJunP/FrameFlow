name: FrameFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  p0-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate Compose
        run: docker compose -f docker-compose.local.yml config --quiet

      - name: Build and test
        env:
          DOCKER_API_VERSION: "1.44"
        run: ./mvnw -B clean verify

      - name: Verify repository hygiene
        env:
          FRAMEFLOW_HYGIENE_OUTPUT: /tmp/frameflow-repo-hygiene.txt
          FRAMEFLOW_HYGIENE_REQUIRE_ZCODE: "false"
        run: sh scripts/p0/check-repo-hygiene.sh
